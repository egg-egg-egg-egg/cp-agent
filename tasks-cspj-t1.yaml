# CSP-J 复赛 T1 专项题库（30 题）
#
# 对标：CSP-J 复赛 2020-2024 第一题（连续五年均为 ★★☆☆☆ / 普及-）
#   2024 扑克牌   计数排序(桶)        2023 小苹果   数学找规律
#   2022 乘方     模拟+边界溢出       2021 分糖果   数学思维(取模)
#   2020 优秀的拆分  位运算/进制
#
# 共性画像（设计依据）：
#   ① 难度全部 ≤ 800（黄sir 定，比真题再低半档，面向刚入门学生）
#   ② 考点仅四类：模拟 / 数学找规律 / 位运算进制 / 计数统计
#   ③ 数据规模小，O(n)~O(n log n) 可过，不涉及复杂数据结构
#   ④ 难点在「读懂规则 + 边界处理」，不在算法本身
#
# 用法（黄sir 确认后执行）：
#   与 tasks.yaml 同格式，独立文件；合并时**必须文本追加**（tasks.yaml 有注释，
#   禁止 yaml round-trip 改写，会丢注释 —— 2026-10-02 踩过）。
#
# ★★ 标程 freopen 约定（同 J 库）★★
#   出题的 solution.cpp 一律纯 stdin/stdout（**绝不写 freopen**，pipeline 用
#   `solution < input.in` 跑）；提交 OJ 时由 batch_submit.py 的 fio_base() 自动注入。
#   ⚠️ batch_submit 用正则匹配 `int\s+main\s*\([^)]*\)\s*\{` 注入 —— 若标程写成
#   其它形式（如宏定义 main）会漏注入 ⇒ OJ RE。已加警告，但设计时留意。

