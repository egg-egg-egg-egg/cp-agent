name: Generate Problem

# 手动出题：按 tasks.yaml 的任务清单出题，产物以 artifact 下载回去。
#
# ─── 设计原则：tasks.yaml 是唯一数据源 ────────────────────────────
# 出题前读它取任务（topic / focus / difficulty），出题成功后回写 status=done
# 并回填目录名，commit 回 main —— 形成闭环，下次运行自动接着往下出。
#
# ─── 三层防自撞 ──────────────────────────────────────────────────
# 第 1 层 tasks.yaml 的 focus 把考点切细 —— LLM 只看自己那一行，看不到其余 99 行，
#         结构性重复在设计阶段就被消除，不靠 LLM 避让。
# 第 2 层 Generate 步骤把「本行考点 + 同 topic 已出题」注入 --extra 做预防；
#         候选池与题目总量脱钩（同 topic 平均 5~18 条）。
# 第 3 层 agent 内的 dedup_check：向量库不可用时回退 tasks.yaml 轻量召回，
#         候选照常送 LLM 裁判；判 must_change 会硬拦截造数据与对拍 ——
#         重复题物理上产不出来。
#
# ─── 一次性前提（仓库 Settings 里做）─────────────────────────────
# 1. Secrets 放 LLM key：DEEPSEEK_API_KEY / OPENAI_API_KEY /
#    ANTHROPIC_API_KEY / MIMO_API_KEY（用哪个配哪个）
# 2. 本文件必须在**默认分支(main)**上，Actions 页面才有 "Run workflow" 按钮
# 3. 若 main 有分支保护规则，需允许 GitHub Actions 推送（否则回写会失败）
#
# ─── 已知限制 ────────────────────────────────────────────────────
# · workbuddy provider 不可用：靠本地文件队列阻塞等会话应答，runner 上没人回
# · 不与公开题库查重：problem_data/ 的 problems.db 185.8MB，
#   超过 GitHub 单文件 100MB 硬限，无法入库（Git LFS 带宽 1GB/月也不够）
# · 不自动上传 OJ：项目硬约束要求「出完停一步等人确认」（见 AGENT.md）
# · Ubuntu 26 将于 2026-10-19 迁移，g++ 版本会变，由 Verify toolchain 步骤兜住

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "指定 tasks.yaml 里的题目 id；留空 = 自动取第一个 pending"
        required: false
        default: ""
      topic:
        description: "覆盖算法主题（留空 = 用 tasks.yaml 该题的值）"
        required: false
        default: ""
      topic_filter:
        description: "只取该 topic 的待出题（并行调度用；留空 = 全局顺序取首个 pending）"
        required: false
        default: ""
      difficulty:
        description: "覆盖难度（留空 = 用 tasks.yaml 该题的值）"
        required: false
        default: ""
      name:
        description: "覆盖目录名；留空 = <topic>_<difficulty>_<run_number>"
        required: false
        default: ""
      provider:
        description: "LLM provider（workbuddy 在 CI 上不可用）"
        required: true
        default: "openai.deepseek"
      idea:
        description: "给定大致题意让系统补全；留空则按 tasklist 的考点自由出题"
        required: false
        default: ""
      extra:
        description: "额外要求（可留空）"
        required: false
        default: ""
      test_count:
        description: "测试点数量"
        required: true
        default: "30"
      stress:
        description: "对拍轮数（调小可显著提速）"
        required: true
        default: "10000"
      max_iterations:
        description: "Agent 最大迭代轮数（本地默认 30 偏紧，CI 用 45）"
        required: true
        default: "45"
      export_formats:
        description: "导出格式：luogu / hydro / polygon / all；留空不导出"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # Mark task done 步骤要 commit tasks.yaml
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

    steps:
      # fetch-depth 0：后面要 push 回写 tasks.yaml，避免 shallow clone 的麻烦
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve task
        id: task
        env:
          IN_TASK_ID: ${{ inputs.task_id }}
          IN_TOPIC_FILTER: ${{ inputs.topic_filter }}
        run: |
          # 没有待出任务时 next 返回 1（合法状态，不是错误），故用 || true 兜住
          python tasklist.py next --id "$IN_TASK_ID" --topic "$IN_TOPIC_FILTER" --format github >> "$GITHUB_OUTPUT" || true
          cat "$GITHUB_OUTPUT"

      - name: No pending task
        if: steps.task.outputs.empty != 'false'
        run: |
          {
            echo "## 没有待出任务"
            echo
            echo "${{ steps.task.outputs.reason }}"
            echo
            echo "要么 100 题都出完了，要么 tasks.yaml 里的 status 都需要人工看。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 先用 testlib.h 试编译，别让编译器兼容问题藏在出题流程中途才爆。
      # 2026-10-19 起 ubuntu-latest 迁到 Ubuntu 26（g++ 版本会变），这步第一时间报警。
      - name: Verify toolchain
        if: steps.task.outputs.empty == 'false'
        run: |
          g++ --version | head -1
          printf '#include "testlib.h"\nint main() { return 0; }\n' > /tmp/testlib_smoke.cpp
          g++ -std=c++17 -O2 -Wall -Wextra -I. -o /tmp/testlib_smoke /tmp/testlib_smoke.cpp
          echo "testlib.h 可编译"

      # config.yaml 被 .gitignore；provider 凭证靠 env_key 读环境变量，天然适配 Secrets
      - name: Prepare config
        if: steps.task.outputs.empty == 'false'
        run: cp config.yaml.example config.yaml

      - name: Generate
        id: gen
        if: steps.task.outputs.empty == 'false'
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
          TASK_TOPIC: ${{ steps.task.outputs.topic }}
          TASK_FOCUS: ${{ steps.task.outputs.focus }}
          TASK_DIFF: ${{ steps.task.outputs.difficulty }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_DIFFICULTY: ${{ inputs.difficulty }}
          IN_NAME: ${{ inputs.name }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_IDEA: ${{ inputs.idea }}
          IN_EXTRA: ${{ inputs.extra }}
          IN_TEST_COUNT: ${{ inputs.test_count }}
          IN_STRESS: ${{ inputs.stress }}
          IN_MAX_ITERATIONS: ${{ inputs.max_iterations }}
          IN_EXPORT: ${{ inputs.export_formats }}
        run: |
          # 手动输入优先，留空则用 tasks.yaml 该行的规格
          TOPIC="$IN_TOPIC"
          if [ -z "$TOPIC" ]; then TOPIC="$TASK_TOPIC"; fi
          DIFF="$IN_DIFFICULTY"
          if [ -z "$DIFF" ]; then DIFF="$TASK_DIFF"; fi
          NAME="$IN_NAME"
          if [ -z "$NAME" ]; then NAME="${TOPIC}_${DIFF}_${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # 第 2 层围栏：本行考点 + 同 topic 已出题，一并作为 --extra 做预防
          EXTRA="$IN_EXTRA"
          if [ -n "$TASK_FOCUS" ]; then
            EXTRA="$(printf '本题指定考点（必须落在该考点上，不要跑偏）：%s\n%s' "$TASK_FOCUS" "$EXTRA")"
          fi
          CTX="$(python tasklist.py context "$TOPIC" || true)"
          if [ -n "$CTX" ]; then
            printf '%s\n以下是同主题已出过的题目，必须避开重复与高度相似：\n' "$EXTRA" > /tmp/ctx.txt
            printf '%s\n' "$CTX" >> /tmp/ctx.txt
            EXTRA="$(cat /tmp/ctx.txt)"
          fi

          ARGS=(--topic "$TOPIC" -d "$DIFF" --name "$NAME")
          ARGS+=(--provider "$IN_PROVIDER")
          ARGS+=(--test-count "$IN_TEST_COUNT" --stress "$IN_STRESS")
          ARGS+=(--max-iterations "$IN_MAX_ITERATIONS")
          if [ -n "$EXTRA" ];    then ARGS+=(--extra "$EXTRA"); fi
          if [ -n "$IN_IDEA" ];  then ARGS+=(--idea "$IN_IDEA"); fi
          if [ -n "$IN_EXPORT" ]; then ARGS+=(--export-after "$IN_EXPORT"); fi

          echo "::group::command"
          printf '%s\n' "python main.py ${ARGS[*]}"
          echo "::endgroup::"
          python main.py "${ARGS[@]}"

      - name: Problem summary
        if: always() && steps.task.outputs.empty == 'false'
        run: |
          D="problems/${{ steps.gen.outputs.name }}"
          {
            echo "## task #${{ steps.task.outputs.id }} · $(basename "$D")"
            echo
            echo "- 考点：${{ steps.task.outputs.focus }}"
            echo "- 主题 / 难度：${{ steps.task.outputs.topic }} / CF ${{ steps.task.outputs.difficulty }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$D/problem.md" ]; then
            {
              echo "- 测试点: $(ls -1 "$D/inputs" 2>/dev/null | wc -l)"
              echo
              echo '```'
              head -n 120 "$D/problem.md"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成 problem.md —— 出题失败，见 Generate 步骤日志" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 回写状态：只有出题成功才标记 done，失败留 pending 供下次重试
      - name: Mark task done
        if: success() && steps.task.outputs.empty == 'false'
        env:
          TASK_ID: ${{ steps.task.outputs.id }}
          GEN_NAME: ${{ steps.gen.outputs.name }}
        run: |
          python tasklist.py mark-done "$TASK_ID" --name "$GEN_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks.yaml
          if git diff --cached --quiet; then
            echo "tasks.yaml 无变化，跳过提交"
          else
            git commit -m "chore(tasks): #${TASK_ID} 出题完成（${GEN_NAME}）"
            # 并行调度下多个 job 会同时 push tasks.yaml —— 失败就 pull --rebase 重试。
            # 不同 topic 改不同行，rebase 不会冲突。
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push origin main; then pushed=1; break; fi
              echo "push 失败（并发冲突？），pull --rebase 后重试（$attempt）"
              git pull --rebase origin main
            done
            if [ -z "$pushed" ]; then echo "::error::push 连续失败"; exit 1; fi
            echo "已回写 tasks.yaml 并推送" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: always() && steps.task.outputs.empty == 'false'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: problem-${{ github.run_id }}
          path: problems/${{ steps.gen.outputs.name }}
          if-no-files-found: warn
          retention-days: 30
