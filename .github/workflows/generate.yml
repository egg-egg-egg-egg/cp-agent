name: Generate Problem

# 手动出题：把算力搬到 GitHub runner 上跑，产物以 artifact 形式下载回去。
#
# ─── 一次性前提（在仓库 Settings 里做，本文件管不了） ───────────────
# 1. Secrets 里放好 LLM key（用哪个 provider 就配哪个，缺哪个都不影响其他）：
#      DEEPSEEK_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY / MIMO_API_KEY
# 2. 本文件必须在**默认分支(main)**上，Actions 页面才会出现 "Run workflow" 按钮。
#
# ─── 防自撞（轻量方案，不依赖 256MB 题库） ─────────────────────────
# 仓库根目录的 `known_problems.txt` 记录我们出过的题，CI 会读它并注入 --extra，
# 要求 LLM 避开。**出新题后手动追加一行** —— 刻意不做自动写回，
# 否则 main 上会出现机器提交，且违背「出完等人确认」的约束。
# 注意：这只防「撞自己」，不防「撞公开题库」（那需要 problem_data/，见下）。
#
# ─── 已知限制 ─────────────────────────────────────────────────────
# · workbuddy provider 不可用：靠本地文件队列阻塞等会话应答，runner 上没人回，
#   会卡到 timeout_sec 才失败。CI 请只用 openai/anthropic 系列。
# · 不与公开题库查重：problem_data/ 里的 problems.db 有 185.8MB，
#   超过 GitHub 单文件 100MB 硬限，无法入库；Git LFS 带宽 1GB/月也不够每次拉取。
#   出题量不大 + 面向初学者，撞公开题库概率低，暂不处理。
# · 不自动上传 OJ：项目硬约束要求「出完停一步等人确认」（见 AGENT.md），
#   产物一律走 artifact，上传由人本地执行 upload.py。
#
# ─── 版本升级记录 ─────────────────────────────────────────────────
# 2026-09-26：actions 升到 v7（checkout v7.0.1 / setup-python v7.0.0 /
#   upload-artifact v7.0.1），消除 Node.js 20 deprecation 警告。
#   回退点：远端分支 backup/ci-before-v7（= 旧版 v4/v5 + 无防自撞）。

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "算法主题 (dp / graph / tree / greedy / ...)"
        required: true
        default: "dp"
      difficulty:
        description: "CF rating (800-3000)"
        required: true
        default: "1500"
      name:
        description: "题目目录名；留空自动生成 <topic>_<difficulty>_<run_number>"
        required: false
        default: ""
      provider:
        description: "LLM provider（workbuddy 在 CI 上不可用）"
        required: true
        default: "openai.deepseek"
      idea:
        description: "给定大致题意让系统补全成完整题目；留空则按 topic 自由出题"
        required: false
        default: ""
      extra:
        description: "额外要求（可留空）"
        required: false
        default: ""
      test_count:
        description: "测试点数量"
        required: true
        default: "30"
      stress:
        description: "对拍轮数（调小可显著提速）"
        required: true
        default: "10000"
      max_iterations:
        description: "Agent 最大迭代轮数（本地默认 30 偏紧，CI 用 45）"
        required: true
        default: "45"
      export_formats:
        description: "成功后导出格式：luogu / hydro / polygon / all；留空不导出"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 先用 testlib.h 试编译，别让编译器兼容问题藏在出题流程中途才爆。
      # 2026-10-19 起 ubuntu-latest 迁到 Ubuntu 26（g++ 版本会变），这步会第一时间报警。
      - name: Verify toolchain
        run: |
          g++ --version | head -1
          printf '#include "testlib.h"\nint main() { return 0; }\n' > /tmp/testlib_smoke.cpp
          g++ -std=c++17 -O2 -Wall -Wextra -I. -o /tmp/testlib_smoke /tmp/testlib_smoke.cpp
          echo "testlib.h 可编译"

      # config.yaml 被 .gitignore；provider 凭证靠 env_key 读环境变量，天然适配 Secrets
      - name: Prepare config
        run: cp config.yaml.example config.yaml

      - name: Generate
        id: gen
        env:
          IN_TOPIC: ${{ inputs.topic }}
          IN_DIFFICULTY: ${{ inputs.difficulty }}
          IN_NAME: ${{ inputs.name }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_IDEA: ${{ inputs.idea }}
          IN_EXTRA: ${{ inputs.extra }}
          IN_TEST_COUNT: ${{ inputs.test_count }}
          IN_STRESS: ${{ inputs.stress }}
          IN_MAX_ITERATIONS: ${{ inputs.max_iterations }}
          IN_EXPORT: ${{ inputs.export_formats }}
        run: |
          NAME="$IN_NAME"
          if [ -z "$NAME" ]; then
            NAME="${IN_TOPIC}_${IN_DIFFICULTY}_${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # 防自撞：把已出题清单并进 --extra（known_problems.txt 不存在则跳过）
          # 走临时文件拼接 —— 直接在 YAML 块标量里写多行字符串会被缩进规则吃掉
          EXTRA="$IN_EXTRA"
          if [ -s known_problems.txt ]; then
            printf '%s\n以下是我们已经出过的题目。你必须出一道与之不重复、也不高度相似的题：\n' \
              "$IN_EXTRA" > /tmp/known_extra.txt
            grep -v '^#' known_problems.txt >> /tmp/known_extra.txt
            EXTRA="$(cat /tmp/known_extra.txt)"
          fi

          ARGS=(--topic "$IN_TOPIC" -d "$IN_DIFFICULTY" --name "$NAME")
          ARGS+=(--provider "$IN_PROVIDER")
          ARGS+=(--test-count "$IN_TEST_COUNT" --stress "$IN_STRESS")
          ARGS+=(--max-iterations "$IN_MAX_ITERATIONS")
          if [ -n "$EXTRA" ];    then ARGS+=(--extra "$EXTRA"); fi
          if [ -n "$IN_IDEA" ];  then ARGS+=(--idea "$IN_IDEA"); fi
          if [ -n "$IN_EXPORT" ]; then ARGS+=(--export-after "$IN_EXPORT"); fi

          echo "::group::command"
          printf '%s\n' "python main.py ${ARGS[*]}"
          echo "::endgroup::"
          python main.py "${ARGS[@]}"

      - name: Problem summary
        if: always()
        run: |
          D="problems/${{ steps.gen.outputs.name }}"
          if [ -f "$D/problem.md" ]; then
            {
              echo "## $(basename "$D")"
              echo
              echo "- 测试点: $(ls -1 "$D/inputs" 2>/dev/null | wc -l)"
              echo
              echo '```'
              head -n 120 "$D/problem.md"
              echo '```'
              echo
              echo "> 题做完后，记得把题名追加到 \`known_problems.txt\`，否则下次可能撞题。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成 problem.md —— 出题失败，见 Generate 步骤日志" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: problem-${{ github.run_id }}
          path: problems/${{ steps.gen.outputs.name }}
          if-no-files-found: warn
          retention-days: 30
