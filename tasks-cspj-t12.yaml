# CSP-J 复赛 T1/T2 难度专项题库（30 题）
#
# 对标：CSP-J 复赛 2018-2024 年前两题
#   T1 ★★☆☆☆（CF 800-1000）：模拟 / 数学找规律 / 字符串 / 位运算 / 计数
#   T2 ★★★☆☆（CF 1100-1400）：贪心 / 二分 / BFS / 排序枚举 / 队列模拟
#
# 本库定位（黄sir 定）：难度 **600-1100** —— 比 T1/T2 真题再低半档，
# 面向刚入门、需要更平缓坡度的学生（真题 T1/T2 多为 800-1400，这里下探到 600）。
#
# 用法（黄sir 确认后再执行）：
#   与 tasks.yaml 同为「唯一数据源」格式，但**独立文件**，不污染已完成 100 题的闭环。
#   跑法：先把本文件内容合并进 tasks.yaml（或改 main.py 读它），再走 generate.yml。
#   ⚠️ 未经确认不要进 workflow —— 30 题一旦跑起来会连写 tasks.yaml。
#
# ★★ 标程 freopen 约定（务必遵守，否则 CI 会炸）★★
#   本项目有两套运行环境，对 freopen 的要求**相反**：
#     · CI / pipeline（generate.yml → main.py → run_solution）：
#         用 `bin/solution < inputs/NN.in`（stdin 重定向）跑标程 ⇒ **标程绝不能写 freopen**
#     · OJ 判题（file_io 模式）：
#         题目是 file_io，判题机按文件读写 ⇒ **必须 freopen**，否则 RE（已踩过）
#   解法：**出题产出的 solution.cpp 一律是纯 stdin/stdout（不写 freopen）**；
#         提交 OJ 时由 `batch_submit.py` 的 `fio_base()` 自动从 hydro 包读 input.name
#         并注入 freopen ⇒ 两套环境各自正确，互不干扰。
#   ⇒ 若在 solution.cpp 里手写 freopen，CI 的 run_solution 会因打不开文件而失败。
#
# 设计原则：
#   1. 只覆盖 T1/T2 考点，不碰 dp/图论/最短路等 T3/T4 内容；
#   2. 每题 focus 互斥（延续「设计期切片」的思路，防同主题撞题）；
#   3. 难度集中在 600-1000，只留 4 题 1100 做上限。

