# tasks.yaml —— 出题任务清单（100 题，面向 CSP-J/S 初学到进阶）
#
# 字段说明
#   id          三位编号，仅用于排序与追踪
#   topic       算法主题，需与 config.yaml 的 topics 对应
#   focus       考点细分 —— 这一栏是防重复的第一道闸门：
#               同一 topic 下把考点切细，100 题对应 100 个不同格子，
#               LLM 出题时只看自己这一行，重复的根源在设计阶段就被消除
#   difficulty  Codeforces rating（800~1800，中考纲范围内）
#   status      pending（待出）/ done（**已出，唯一参与出题与看板同步的状态**）
#               failed（出题失败，需人工介入）
#               archived（已归档：曾出过但已废弃、或已决定放弃 ⇒ 永久出局）
#   name        题目目录名；status=done 时由 CI 自动回填
#
# 维护约定
#   · CI 出题成功后会**自动把 status 改成 done 并回填 name**（commit 回 main）
#   · 想调整内容直接改本文件；**想跳过的题把 status 改成 failed 或 archived 即可**
#   · 判据：build_records.build_entries() 只收 status=done 的行
#     ⇒ 其余状态既不进看板、也不会被 --scan 当作「name 失效」告警；
#       archived 行可以留着 name 供追溯，无害
#   · 难度梯度参考：入门 800-1000 / 基础 1100-1400 / 进阶 1500-1800
#   · 已刻意避开五年真题未考的项：线段树、树形DP、网络流、复杂几何

